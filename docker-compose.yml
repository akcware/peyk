services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: .
    command: gateway
    env_file: .env
    environment:
      DATABASE_URL: postgresql://agent:agent@db:5432/agent
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["app"]

  workers:
    build: .
    command: workers
    env_file: .env
    environment:
      DATABASE_URL: postgresql://agent:agent@db:5432/agent
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["app"]

  sessions:
    build: .
    command: python -m sessions.main
    env_file: .env
    environment:
      DATABASE_URL: postgresql://agent:agent@db:5432/agent
    depends_on:
      db:
        condition: service_healthy
    restart: always
    profiles: ["app"]

volumes:
  pgdata:
