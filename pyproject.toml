[project]
name = "proactive-agent"
version = "0.1.0"
description = "Peyk — a quiet messenger: observes Gmail/Calendar/Telegram, triages, interrupts only when it matters."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "structlog>=24.4",
    "phonenumbers>=8.13",
    "composio==0.21.1",
    "strands-agents[anthropic]>=1.55,<2",
    "botocore[crt]>=1.40",
    "soundfile>=0.14.0",
    "amazon-transcribe>=0.6.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]
agentcore = [
    "bedrock-agentcore>=1.22",
    "bedrock-agentcore-starter-toolkit>=0.3",
]

[tool.uv]
# amazon-transcribe pins awscrt~=0.26 while botocore[crt] pins the current awscrt; the transcribe SDK only uses
# the stable awscrt.http/awscrt.auth surface and runs on the newer build (verified with a real stream, see
# tests/phase0/test_stt.py).
override-dependencies = ["awscrt==0.36.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "llm: needs a real model (not run in CI)",
    "db: needs TEST_DATABASE_URL",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools]
packages = ["core", "core.repo", "adapters", "adapters.composio", "adapters.telegram", "adapters.whatsapp", "gateway", "workers", "agent", "db", "db.migrations"]

[tool.setuptools.package-data]
# migrate.py reads the SQL files next to it; without this a wheel ships the runner but no migrations.
"db.migrations" = ["*.sql"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
