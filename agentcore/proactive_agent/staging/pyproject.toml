# Dependency manifest for the AgentCore CodeZip build (agentcore CLI runs `uv pip install -r pyproject.toml`).
# Keep in sync with agent/requirements.txt. No psycopg, no composio: the agent never touches the DB.
[project]
name = "proactive-agent-runtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=1.55,<2",
    "bedrock-agentcore>=1.22",
    "pydantic>=2.9",
    "aws-opentelemetry-distro>=0.19",
]
